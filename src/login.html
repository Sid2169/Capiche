<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capiche - Sign In</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* -----------------------------------------------
         FONTS
      ----------------------------------------------- */
      @font-face {
        font-family: "berkshire";
        src:
          url("assets/fonts/berkshireswash-regular-webfont.woff2") format("woff2"),
          url("assets/fonts/berkshireswash-regular-webfont.woff") format("woff");
        font-weight: normal;
        font-style: normal;
      }

      /* -----------------------------------------------
         RESET
      ----------------------------------------------- */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* -----------------------------------------------
         VARIABLES — mirrors style.css exactly
      ----------------------------------------------- */
      :root {
        --color-bg-primary:    #101010;
        --secondary-color:     #1c1c1c;
        --text-color:          #008b8b;
        --accent-color:        #e6f7ff;
        --color-text-accent:   #00bfff;
        --blue:                hsl(212, 100%, 48%);
        --yellow:              hsl(41,  100%, 50%);
        --red:                 hsl(0,   100%, 57%);
        --red-text:            hsl(0,   90%,  44%);

        --font-primary:  "Inter", sans-serif;
        --font-display:  "berkshire", serif;

        --radius-sm: 6px;
        --radius-md: 8px;
      }

      /* -----------------------------------------------
         BASE
      ----------------------------------------------- */
      html, body {
        height: 100%;
        font-family: var(--font-primary);
        font-size: 10px;
        background-color: var(--color-bg-primary);
        color: var(--text-color);
        line-height: 1.2;
        text-rendering: optimizeLegibility;
      }

      /* -----------------------------------------------
         LAYOUT
      ----------------------------------------------- */
      .page {
        display: flex;
        min-height: 100%;
      }

      /* Left panel — decorative brand strip */
      .panel-brand {
        display: none;
        position: relative;
        width: 380px;
        flex-shrink: 0;
        background-color: var(--secondary-color);
        border-right: 1px solid rgba(0, 139, 139, 0.12);
        overflow: hidden;
      }

      @media (min-width: 900px) {
        .panel-brand { display: flex; flex-direction: column; justify-content: space-between; padding: 50px 40px; }
      }

      .brand-logo {
        font-family: var(--font-display);
        font-size: 5rem;
        color: var(--color-text-accent);
        line-height: 1;
        letter-spacing: -0.5px;
      }

      .brand-tagline {
        font-size: 1.4rem;
        font-weight: 400;
        color: var(--text-color);
        opacity: 0.7;
        margin-top: 12px;
        line-height: 1.6;
      }

      /* Decorative grid dots */
      .brand-dots {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle, rgba(0, 139, 139, 0.15) 1px, transparent 1px);
        background-size: 28px 28px;
        pointer-events: none;
      }

      /* Decorative teal glow blob */
      .brand-glow {
        position: absolute;
        bottom: -80px;
        left: -80px;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 191, 255, 0.08) 0%, transparent 70%);
        pointer-events: none;
      }

      .brand-footer {
        font-size: 1.2rem;
        color: var(--text-color);
        opacity: 0.4;
      }

      /* -----------------------------------------------
         AUTH PANEL
      ----------------------------------------------- */
      .panel-auth {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
      }

      .auth-box {
        width: 100%;
        max-width: 400px;
        animation: fadeUp 0.35s ease both;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Mobile logo (shown only when left panel is hidden) */
      .mobile-logo {
        font-family: var(--font-display);
        font-size: 4rem;
        color: var(--color-text-accent);
        margin-bottom: 32px;
        display: block;
      }

      @media (min-width: 900px) {
        .mobile-logo { display: none; }
      }

      /* Tab switcher */
      .auth-tabs {
        display: flex;
        gap: 4px;
        background-color: var(--secondary-color);
        border-radius: var(--radius-md);
        padding: 4px;
        margin-bottom: 28px;
      }

      .auth-tab {
        flex: 1;
        padding: 9px;
        font-size: 1.4rem;
        font-weight: 600;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background: none;
        color: var(--text-color);
        transition: background-color 0.18s ease, color 0.18s ease;
        font-family: var(--font-primary);
      }

      .auth-tab.active {
        background-color: var(--accent-color);
        color: var(--color-text-accent);
      }

      /* Form */
      .auth-form {
        display: none;
        flex-direction: column;
        gap: 18px;
      }

      .auth-form.active {
        display: flex;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .field label {
        font-size: 1.3rem;
        font-weight: 600;
        color: var(--text-color);
      }

      .field input {
        font-family: var(--font-primary);
        font-size: 1.5rem;
        background-color: var(--secondary-color);
        color: var(--accent-color);
        border: 1px solid rgba(0, 139, 139, 0.25);
        border-radius: var(--radius-sm);
        padding: 11px 14px;
        outline: none;
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
        width: 100%;
      }

      .field input::placeholder {
        color: rgba(0, 139, 139, 0.35);
      }

      .field input:focus {
        border-color: var(--text-color);
        box-shadow: 0 0 0 3px rgba(0, 139, 139, 0.12);
      }

      /* Error message */
      .field-error {
        font-size: 1.2rem;
        color: var(--red-text);
        display: none;
      }

      .field-error.active {
        display: block;
      }

      /* Submit button */
      .btn-submit {
        font-family: var(--font-primary);
        font-size: 1.5rem;
        font-weight: 700;
        padding: 13px;
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        background-color: var(--accent-color);
        color: var(--text-color);
        transition: background-color 0.18s ease, color 0.18s ease, transform 0.1s ease;
        margin-top: 4px;
      }

      .btn-submit:hover {
        background-color: #fff;
        color: var(--color-text-accent);
      }

      .btn-submit:active {
        transform: scale(0.98);
      }

      .btn-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      /* Global error banner */
      .auth-error {
        font-size: 1.3rem;
        color: var(--red-text);
        background-color: rgba(255, 50, 50, 0.07);
        border: 1px solid rgba(255, 50, 50, 0.18);
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        display: none;
      }

      .auth-error.active {
        display: block;
        animation: fadeUp 0.2s ease both;
      }

      /* Success banner */
      .auth-success {
        font-size: 1.3rem;
        color: #00bfff;
        background-color: rgba(0, 191, 255, 0.06);
        border: 1px solid rgba(0, 191, 255, 0.18);
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        display: none;
      }

      .auth-success.active {
        display: block;
        animation: fadeUp 0.2s ease both;
      }

      /* Divider */
      .auth-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 4px 0;
      }

      .auth-divider span {
        font-size: 1.2rem;
        color: rgba(0, 139, 139, 0.4);
        white-space: nowrap;
      }

      .auth-divider::before,
      .auth-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background-color: rgba(0, 139, 139, 0.15);
      }

      /* Spinner */
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(0, 139, 139, 0.3);
        border-top-color: var(--text-color);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading .btn-submit { pointer-events: none; }
    </style>
  </head>

  <body>
    <div class="page">

      <!-- Brand panel (desktop only) -->
      <aside class="panel-brand">
        <div class="brand-dots"></div>
        <div class="brand-glow"></div>

        <div>
          <div class="brand-logo">Capiche</div>
          <p class="brand-tagline">
            Your tasks, your projects,<br />your pace.
          </p>
        </div>

        <p class="brand-footer">© 2025 Capiche</p>
      </aside>

      <!-- Auth panel -->
      <main class="panel-auth">
        <div class="auth-box">

          <!-- Mobile logo -->
          <span class="mobile-logo">Capiche</span>

          <!-- Tab switcher -->
          <div class="auth-tabs" role="tablist">
            <button
              class="auth-tab active"
              role="tab"
              aria-selected="true"
              data-tab="login"
            >Sign in</button>
            <button
              class="auth-tab"
              role="tab"
              aria-selected="false"
              data-tab="register"
            >Create account</button>
          </div>

          <!-- Banners -->
          <div class="auth-error" id="authError" role="alert"></div>
          <div class="auth-success" id="authSuccess" role="status"></div>

          <!-- LOGIN FORM -->
          <form
            class="auth-form active"
            id="loginForm"
            novalidate
            autocomplete="on"
          >
            <div class="field">
              <label for="loginEmail">Email</label>
              <input
                type="email"
                id="loginEmail"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
              <span class="field-error" id="loginEmailErr">Please enter a valid email.</span>
            </div>

            <div class="field">
              <label for="loginPassword">Password</label>
              <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <span class="field-error" id="loginPasswordErr">Password is required.</span>
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">
              Sign in
            </button>
          </form>

          <!-- REGISTER FORM -->
          <form
            class="auth-form"
            id="registerForm"
            novalidate
            autocomplete="on"
          >
            <div class="field">
              <label for="regEmail">Email</label>
              <input
                type="email"
                id="regEmail"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
              <span class="field-error" id="regEmailErr">Please enter a valid email.</span>
            </div>

            <div class="field">
              <label for="regPassword">Password</label>
              <input
                type="password"
                id="regPassword"
                name="password"
                placeholder="Min. 8 characters"
                autocomplete="new-password"
                required
                minlength="8"
              />
              <span class="field-error" id="regPasswordErr">Password must be at least 8 characters.</span>
            </div>

            <div class="field">
              <label for="regConfirm">Confirm password</label>
              <input
                type="password"
                id="regConfirm"
                name="confirm"
                placeholder="Re-enter password"
                autocomplete="new-password"
                required
              />
              <span class="field-error" id="regConfirmErr">Passwords do not match.</span>
            </div>

            <button type="submit" class="btn-submit" id="registerBtn">
              Create account
            </button>
          </form>

        </div>
      </main>
    </div>
  </body>
</html>
